<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="article">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"{{ page.schema_type | default: 'Article' }}",
   "headline":"{{ page.title }}","datePublished":"{{ page.date | date_to_xmlschema }}",
   "author":{"@type":"Person","name":"{{ page.author | default: 'TechPicks Team' }}"}}
  </script>
</head>
<body>
  <header>
    <nav>
      <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
      <ul>
        <li><a href="{{ '/categories/reviews' | relative_url }}">Reviews</a></li>
        <li><a href="{{ '/categories/guides' | relative_url }}">Guides</a></li>
      </ul>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
    <p><small>As an Amazon Associate we earn from qualifying purchases.</small></p>
  </footer>
</body>
</html>
